<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>English_GA — Grammar Practice</title>
  <meta name="description" content="Short, mobile-friendly English grammar practice sessions.">
  <meta name="theme-color" content="#f6f7fb">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="English_GA">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#/" aria-label="English_GA home">
        <img class="brand-mark" src="icon.svg" width="40" height="40" alt="">
        <span class="brand-name" aria-hidden="true">English_<span>GA</span></span>
      </a>
      <p class="streak" id="streak" aria-live="polite"></p>
    </header>

    <!-- Views are rendered here by app.js -->
    <main id="app" tabindex="-1">
      <p>Loading…</p>
    </main>

    <noscript>
      <div class="notice"><p>English_GA needs JavaScript to run.</p></div>
    </noscript>
  </div>

  <nav class="tabbar" aria-label="Main">
    <ul>
      <li>
        <a href="#/" data-tab="overview">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg>
          Overview
        </a>
      </li>
      <li>
        <a href="#/practice" data-tab="practice">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4zM14 7l3 3"/></svg>
          Practice
        </a>
      </li>
    </ul>
  </nav>

  <!-- Screen-reader announcements for feedback and view changes -->
  <div id="announcer" class="sr-only" aria-live="polite"></div>
</body>
</html>
